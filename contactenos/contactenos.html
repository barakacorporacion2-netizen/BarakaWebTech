    <section class="contacto">

        <h1>Contáctenos</h1>

        <p class="descripcion">
            Estamos aquí para ayudarte.
            <br>
            Escríbenos y te responderemos lo antes posible.
        </p>

        <div class="contenedor">

            <!-- INFORMACIÓN -->
            <div class="informacion">

              <div class="mapa">

         <iframe
          src="https://www.google.com/maps?q=Corporación+Baraka+Bogotá&output=embed"
          loading="lazy"
           allowfullscreen
            referrerpolicy="no-referrer-when-downgrade">
         </iframe>

        </div>

                <div class="datos">

                    <p>
                        📧 Correo electrónico
                        <br>
                        barakacorporacion@gmail.com
                    </p>

                    <p>
                        ☎ Teléfono
                        <br>
                        +57 3054643307
                    </p>

                    <p>
                        📍 Ubicación
                        <br>
                        Bogotá, Colombia
                    </p>

                </div>

            </div>

         <!-- FORMULARIO -->
<div class="formulario">

    <form
        id="formulario"
        action="https://formspree.io/f/mrewbabj"
        method="POST"
        enctype="multipart/form-data"
        novalidate>

        <!-- NOMBRE -->
        <label for="nombre">
            Nombre completo
        </label>

        <input
            type="text"
            id="nombre"
            name="nombre"
            placeholder="Ejemplo: María Fernanda Gómez"
            minlength="5"
            maxlength="50"
            autocomplete="name"
            required>

        <small id="errorNombre"></small>


        <!-- CORREO -->
        <label for="correo">
            Correo electrónico
        </label>

        <input
            type="email"
            id="correo"
            name="correo"
            placeholder="ejemplo@gmail.com"
            maxlength="100"
            autocomplete="email"
            required>

        <small id="errorCorreo"></small>


        <!-- TELÉFONO -->
        <label for="telefono">
            Teléfono
        </label>

        <input
            type="tel"
            id="telefono"
            name="telefono"
            placeholder="Entre 7 y 10 números"
            minlength="7"
            maxlength="10"
            inputmode="numeric"
            autocomplete="tel"
            required>

        <small id="errorTelefono"></small>


        <!-- MENSAJE -->
        <label for="mensaje">
            Mensaje
        </label>

        <textarea
            id="mensaje"
            name="mensaje"
            placeholder="Escriba aquí su mensaje..."
            minlength="15"
            maxlength="100"
            required></textarea>

        <small id="errorMensaje"></small>


        <!-- PDF -->
        <label for="archivo">
            Adjuntar documento PDF
        </label>

        <input
            type="file"
            id="archivo"
            name="archivo"
            accept=".pdf,application/pdf">

        <small id="errorArchivo"></small>


        <!-- BOTÓN -->
        <button type="submit">
            Enviar Mensaje
        </button>


        <!-- MENSAJE GENERAL -->
        <p id="mensajeFormulario"></p>

    </form>

</div>

        </div>
